name: Release build Manual

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag_name:
        description: 'Release tag name (only effective when dry_run = false, example v1.2.3)'
        required: false
        type: string
      build_android:
        description: Build Android platform artifacts.
        required: true
        type: boolean
        default: true
      build_ios:
        description: Build iOS platform artifacts.
        required: true
        type: boolean
        default: true
      build_linux:
        description: Build Linux platform artifacts.
        required: true
        type: boolean
        default: true
      build_macos:
        description: Build MacOS platform artifacts.
        required: true
        type: boolean
        default: true
      build_windows:
        description: Build Windows platform artifacts.
        required: true
        type: boolean
        default: true
      dry_run:
        description: Dry run, do NOT create release and NOT upload to release page.
        required: true
        type: boolean
        default: true

env:
  CI_FLUTTER_VERSION: "3.41.5"
  CI_RUST_VERSION: "1.83.0"

jobs:
  create-release:
    name: Create GitHub Release
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.release_tag_name != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PRERELEASE: ${{ contains(inputs.release_tag_name, '-') }}
    outputs:
      release-id: ${{ steps.create_release.outputs.id }}
      release-upload-url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.release_tag_name }}
          prerelease: ${{ env.PRERELEASE }}
          allowUpdates: true
          omitPrereleaseDuringUpdate: true
          body: "Built from manual Test build workflow"

  build-linux:
    name: Build Linux
    if: ${{ github.event_name == 'pull_request' || inputs.build_linux }}
    runs-on: ubuntu-latest
    needs: [create-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
          cache: true
      - run: |
          sudo apt update -y
          sudo apt install -y ninja-build libgtk-3-dev sqlite3 libsqlite3-dev
      - name: Precompile
        run: |
          git submodule update --init --recursive --force
          flutter pub get
          dart ./Makefile.dart
      - name: Build Linux
        if: ${{ github.event_name == 'pull_request' || inputs.build_linux }}
        run: flutter build linux --release
      - name: Pre Packing
        if: ${{ github.event_name == 'pull_request' || inputs.build_linux }}
        run: |
          pushd build/linux/x64/release/
          mv bundle tsdm_client
          popd
      - name: Pack Linux tarball
        if: ${{ github.event_name == 'pull_request' || inputs.build_linux }}
        uses: thedoctor0/zip-release@master
        with:
          type: "tar"
          filename: tsdm_client-linux.tar.gz
          directory: build/linux/x64/release/
          path: tsdm_client
      - name: Upload Linux artifacts to workflow artifact
        if: ${{ github.event_name == 'pull_request' || (!inputs.dry_run && inputs.build_linux) }}
        uses: actions/upload-artifact@v4
        with:
          name: tsdm_client-linux-tarball
          path: build/linux/x64/release/tsdm_client-linux.tar.gz
      - name: Upload to GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.build_linux && inputs.release_tag_name != '' }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: build/linux/x64/release/tsdm_client-linux.tar.gz
          tag: ${{ inputs.release_tag_name }}

  build-android:
    name: Build Android
    if: ${{ github.event_name == 'pull_request' || inputs.build_android }}
    runs-on: ubuntu-latest
    needs: [create-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
          cache: true
      - run: |
          sudo ./scripts/github_free_disk_space.sh
          sudo apt update -y
          sudo apt install -y ninja-build libgtk-3-dev
          git submodule update --init --recursive --force
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{env.CI_RUST_VERSION}}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
      - name: Update NDK path
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
      - name: Prepare flutter_avif
        run: |
          sudo apt install -y make meson nasm
          cargo install cargo-ndk@3.5.4 --locked
          ./scripts/build-flutter_avif-android.sh
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Precompile
        run: |
          flutter pub get
          dart ./Makefile.dart
      - name: Setup Android sign key
        if: ${{ github.event_name == 'pull_request' || inputs.build_android }}
        run: |
          echo '${{ secrets.KEYSTORE }}' | base64 --decode > android/app/key.jks
          echo '${{ secrets.KEY_PROPERTIES }}' > android/key.properties
      - name: Build Android
        if: ${{ github.event_name == 'pull_request' || inputs.build_android }}
        run: |
          flutter build apk --release
      - name: Pack Android apk
        if: ${{ github.event_name == 'pull_request' || inputs.build_android }}
        run: |
          pushd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk tsdm_client-arm64_v8a.apk
          mv app-armeabi-v7a-release.apk tsdm_client-armeabi_v7a.apk
          popd
      - name: Upload Android artifacts to workflow artifact
        if: ${{ github.event_name == 'pull_request' || (!inputs.dry_run && inputs.build_android) }}
        uses: actions/upload-artifact@v4
        with:
          name: tsdm_client-apk
          path: |
            build/app/outputs/flutter-apk/tsdm_client-arm64_v8a.apk
            build/app/outputs/flutter-apk/tsdm_client-armeabi_v7a.apk
      - name: Upload to GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.build_android && inputs.release_tag_name != '' }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: |
            build/app/outputs/flutter-apk/tsdm_client-arm64_v8a.apk
            build/app/outputs/flutter-apk/tsdm_client-armeabi_v7a.apk
          tag: ${{ inputs.release_tag_name }}

  build-windows:
    name: Build Windows
    if: ${{ github.event_name == 'pull_request' || inputs.build_windows }}
    runs-on: windows-latest
    needs: [create-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
      - name: Precompile
        shell: pwsh
        run: |
          git submodule update --init --recursive --force
          flutter pub get
          dart ./Makefile.dart
      - name: Build Windows
        run: flutter build windows --release
      - name: Pre Packing
        shell: pwsh
        run: |
          cd build/windows/x64/runner
          Rename-Item Release tsdm_client
          cd ../../../../
      - name: Pack Windows tarball
        uses: thedoctor0/zip-release@master
        with:
          type: "zip"
          filename: tsdm_client-windows.zip
          directory: build/windows/x64/runner
          path: tsdm_client
      - name: Upload Windows artifacts to workflow artifact
        if: ${{ github.event_name == 'pull_request' || (!inputs.dry_run && inputs.build_windows) }}
        uses: actions/upload-artifact@v4
        with:
          name: tsdm_client-windows-tarball
          path: build/windows/x64/runner/tsdm_client-windows.zip
      - name: Upload to GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.build_windows && inputs.release_tag_name != '' }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: build/windows/x64/runner/tsdm_client-windows.zip
          tag: ${{ inputs.release_tag_name }}

  build-macos-and-ios:
    name: Build MacOS and iOS
    if: ${{ github.event_name == 'pull_request' || inputs.build_macos || inputs.build_ios }}
    runs-on: macos-latest
    needs: [create-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.CI_FLUTTER_VERSION}}
          cache: true
      - name: Precompile
        run: |
          git submodule update --init --recursive --force
          flutter pub get
          dart ./Makefile.dart
      - name: Build MacOS
        if: ${{ github.event_name == 'pull_request' || inputs.build_macos }}
        run: |
          flutter build macos --release
      - name: Packing MacOS dmg
        if: ${{ github.event_name == 'pull_request' || inputs.build_macos }}
        run: |
          brew install python-setuptools
          npm install -g appdmg
          appdmg appdmg.json build/tsdm_client-universal.dmg
      - name: Upload MacOS artifacts to workflow artifact
        if: ${{ github.event_name == 'pull_request' || (!inputs.dry_run && inputs.build_macos) }}
        uses: actions/upload-artifact@v4
        with:
          name: tsdm_client-macos-tarball
          path: build/tsdm_client-universal.dmg
      - name: Upload macOS to GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.build_macos && inputs.release_tag_name != '' }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: build/tsdm_client-universal.dmg
          tag: ${{ inputs.release_tag_name }}
      - name: Build iOS ipa
        if: ${{ github.event_name == 'pull_request' || inputs.build_ios }}
        run: |
          flutter build ios --release --no-codesign
      - name: Packing
        if: ${{ github.event_name == 'pull_request' || inputs.build_ios }}
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r9 tsdm_client.ipa Payload
      - name: Upload iOS artifacts to workflow artifact
        if: ${{ github.event_name == 'pull_request' || (!inputs.dry_run && inputs.build_ios) }}
        uses: actions/upload-artifact@v4
        with:
          name: tsdm_client-ios-tarball
          path: tsdm_client.ipa
      - name: Upload iOS to GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.build_ios && inputs.release_tag_name != '' }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: tsdm_client.ipa
          tag: ${{ inputs.release_tag_name }}
