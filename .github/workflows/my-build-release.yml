name: My Release
on:
  workflow_dispatch:

env:
  CI_FLUTTER_VERSION: "3.41.1"
  CI_RUST_VERSION: "1.83.0"

jobs:
  android-fat:
    name: Build Android Fat Full Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Prepare system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ninja-build libgtk-3-dev make meson nasm

      - name: Retry clone git submodules
        run: |
          for i in {1..5}; do
            git submodule update --init --recursive --force && break
            echo "Submodule clone retry $i ..."
            sleep 5
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Update NDK path
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build flutter_avif native library
        run: |
          cargo install cargo-ndk@3.5.4 --locked
          ./scripts/build-flutter_avif-android.sh
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Precompile
        run: |
          flutter pub get
          dart ./Makefile.dart

      - name: Setup Android sign key
        run: |
          echo '${{ secrets.KEYSTORE }}' | base64 --decode > android/app/key.jks
          echo '${{ secrets.KEY_PROPERTIES }}' > android/key.properties

      - name: Build full fat apk
        run: flutter build apk --release

      - name: upload fat apk
        uses: actions/upload-artifact@v4
        with:
          name: android-fat-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  android-split:
    name: Build Android Split ABI Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Prepare system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ninja-build libgtk-3-dev make meson nasm binutils

      - name: Retry clone git submodules
        run: |
          for i in {1..5}; do
            git submodule update --init --recursive --force && break
            echo "Submodule clone retry $i ..."
            sleep 5
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Update NDK path
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build flutter_avif native library
        run: |
          cargo install cargo-ndk@3.5.4 --locked
          ./scripts/build-flutter_avif-android.sh
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      # 保留so符号剥离瘦身
      - name: Strip debug symbols from native .so
        run: |
          find android/app/src/main -name "*.so" -type f -exec strip --strip-all {} \;

      - name: Precompile dart & flutter assets
        run: |
          flutter pub get
          dart ./Makefile.dart

      - name: Build split‑per‑abi release APK
        run: |
          FLUTTER_TOOLS_NO_WATCHER=true flutter build apk --release --split-per-abi || true

      - name: List generated apks (debug)
        run: ls -lh build/app/outputs/flutter-apk/

      # ========== 使用现成Action签名，自动处理apksigner ==========
      - name: Sign arm64-v8a APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: build/app/outputs/flutter-apk
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASS }}
          keyPassword: ${{ secrets.KEY_PASS }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Sign armeabi-v7a APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: build/app/outputs/flutter-apk
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASS }}
          keyPassword: ${{ secrets.KEY_PASS }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: upload split apks
        uses: actions/upload-artifact@v4
        with:
          name: android-split-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Precompile
        shell: pwsh
        run: |
          for($i=1;$i -le 5;$i++){
            git submodule update --init --recursive --force; if($LASTEXITCODE -eq 0){break}; echo "submodule retry $i"; Start-Sleep 5
          }
          flutter pub get
          dart ./Makefile.dart

      - name: Build Windows release
        run: flutter build windows --release

      - name: zip windows release
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-app.zip

      - name: upload windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-zip
          path: windows-app.zip

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Install linux dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ninja-build libgtk-3-dev make meson nasm

      - name: Retry clone git submodules
        run: |
          for i in {1..5}; do
            git submodule update --init --recursive --force && break
            echo "Submodule clone retry $i ..."
            sleep 5
          done

      - name: Precompile
        run: |
          flutter pub get
          dart ./Makefile.dart

      - name: Build Linux release
        run: flutter build linux --release

      - name: upload linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-bundle
          path: build/linux/x64/release/bundle/

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Precompile
        run: |
          for i in {1..5}; do
            git submodule update --init --recursive --force && break
            echo "Submodule clone retry $i ..."
            sleep 5
          done
          flutter pub get
          dart ./Makefile.dart

      - name: Build macOS release
        run: flutter build macos --release

      - name: upload macos app
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-app
          path: build/macos/Build/Products/Release/*.app

  ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Precompile
        run: |
          for i in {1..5}; do
            git submodule update --init --recursive --force && break
            echo "Submodule clone retry $i ..."
            sleep 5
          done
          flutter pub get
          dart ./Makefile.dart

      - name: Build iOS archive (no codesign)
        run: flutter build ios --release --no-codesign

      - name: upload ios archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-archive
          path: build/ios/iphoneos/

  create-draft-release:
    needs: [android-fat, android-split, windows, linux, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: 手动构建版本
          draft: true
          files: |
            android-fat-apk/app-release.apk
            android-split-apk/*.apk
            windows-build-zip/windows-app.zip
            linux-build-bundle/*
            macos-build-app/*
            ios-build-archive/*
