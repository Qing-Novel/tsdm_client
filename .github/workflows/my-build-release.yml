name: My Build Android & Windows
on:
  workflow_dispatch:

env:
  CI_FLUTTER_VERSION: "3.41.1"
  CI_RUST_VERSION: "1.83.0"

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Prepare system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ninja-build libgtk-3-dev make meson nasm
          git submodule update --init --recursive --force

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.CI_RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Update NDK path
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build flutter_avif native library
        run: |
          cargo install cargo-ndk@3.5.4 --locked
          ./scripts/build-flutter_avif-android.sh
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Precompile (pub get + freezed + drift schema all in one)
        run: |
          flutter pub get
          dart ./Makefile.dart

      # ==========修复jks base64解码：同时删除 \r 和 \n，防止换行破坏jks二进制==========
      - name: decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 --decode > android/app/upload-keystore.jks
        shell: bash

      - name: write key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
        shell: bash

      - name: Build Android apk release
        run: flutter build apk --release

      - name: upload signed apk
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      # 修复新版MSVC experimental coroutine静态断言报错
      _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS: 1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.CI_FLUTTER_VERSION }}
          cache: true

      - name: Precompile
        shell: pwsh
        run: |
          git submodule update --init --recursive --force
          flutter pub get
          dart ./Makefile.dart

      - name: Build Windows release
        run: flutter build windows --release

      - name: zip windows release
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-app.zip

      - name: upload windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-zip
          path: windows-app.zip

  create-draft-release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: 手动构建版本
          draft: true
          files: |
            signed-android-apk/app-release.apk
            windows-build-zip/windows-app.zip
